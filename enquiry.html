<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry | MetroGym</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="brand">METRO<span>GYM</span></a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="classes.html">Classes</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="enquiry.html" aria-current="page">Enquire</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="hero" style="padding:70px 0 50px;">
  <div class="container">
    <p class="eyebrow">Book A Free Trial</p>
    <h1>Send an Enquiry</h1>
    <p class="lead">Tell us a bit about yourself and a coach will reach out to schedule your first session.</p>
  </div>
</section>

<section>
  <div class="container">
    <form action="#" method="post">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="field">
        <label for="interest">I'm Interested In</label>
        <select id="interest" name="interest">
          <option value="metrofit">MetroFit</option>
          <option value="strength">Strength &amp; Conditioning</option>
          <option value="metrostart">MetroStart (Beginners)</option>
          <option value="other">Not Sure Yet</option>
        </select>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell us about your fitness goals or ask a question..."></textarea>
      </div>
      <button type="submit" class="btn">Submit Enquiry</button>
    </form>
  </div>
</section>

<footer>
  <div class="container">
    <span>&copy; 2026 MetroGym. Cape Road, Gqeberha.</span>
    <span>Functional Fitness Since 2016</span>
  </div>
</footer>

</body>
</html>
